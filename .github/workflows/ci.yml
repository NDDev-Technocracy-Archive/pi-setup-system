name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    name: Declared toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUSTUP_AUTO_INSTALL: '0'
    outputs:
      rust: ${{ steps.project.outputs.rust }}
      components: ${{ steps.project.outputs.components }}
      msrv: ${{ steps.project.outputs.msrv }}
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
        with:
          managed: 'false'
          python-version: '3.15.2'
          sparse-checkout-cone-mode: 'false'
          sparse-checkout: |
            /Cargo.toml
            /rust-toolchain.toml
            /justfile
            /tools/ci_inputs.py
      - name: Read compiler and minimum from their authoritative manifests
        id: project
        run: just ci-inputs >> "$GITHUB_OUTPUT"
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
        if: always()
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: declared toolchain inputs
          name: inputs

  source:
    needs: inputs
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read
    with:
      recipe: check
      prepare: setup
      fetch-depth: 0
      hosted-runner: ubuntu-24.04
      rust-version: ${{ needs.inputs.outputs.rust }}
      rust-components: ${{ needs.inputs.outputs.components }}
      python-version: '3.15.2'
      tools: cargo-deny@0.20.2,cargo-audit@0.23.0,cargo-machete@0.9.2,zizmor@1.32.0,shellcheck@0.11.0,shfmt@3.14.1
      tool-assets: tools/ci-tools.json
      timeout-minutes: 20

  rust:
    needs: inputs
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read
    with:
      recipe: test
      prepare: fetch
      hosted-runner: ubuntu-24.04
      rust-version: ${{ needs.inputs.outputs.rust }}
      rust-components: ${{ needs.inputs.outputs.components }}
      python-version: '3.15.2'
      timeout-minutes: 30

  boundary:
    name: boundary (${{ matrix.os }})
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        # Windows import-table coverage is not claimed; native tests still cover Windows.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-26"]') }}
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read
    with:
      recipe: boundary
      prepare: fetch
      hosted-runner: ${{ matrix.os }}
      rust-version: ${{ needs.inputs.outputs.rust }}
      rust-components: ${{ needs.inputs.outputs.components }}
      python-version: '3.15.2'
      timeout-minutes: 20

  platforms:
    needs: inputs
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read
    with:
      recipe: test-platform
      prepare: fetch
      hosted-runner: ${{ matrix.os }}
      rust-version: ${{ needs.inputs.outputs.rust }}
      rust-components: ${{ needs.inputs.outputs.components }}
      python-version: '3.15.2'
      timeout-minutes: 40

  msrv:
    needs: inputs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_AUTO_INSTALL: '0'
      RUSTUP_TOOLCHAIN: ${{ needs.inputs.outputs.msrv }}
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
        with:
          managed: 'false'
          rust-version: ${{ needs.inputs.outputs.msrv }}
          python-version: '3.15.2'
      - name: Prepare exact locked dependencies
        id: dependencies
        run: just fetch
      - name: Compile with the actual declared minimum
        id: project
        run: just minimum
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
        if: always()
        with:
          status: ${{ job.status }}
          project-outcome: ${{ (steps.dependencies.outcome == 'failure' || steps.project.outcome == 'failure') && 'failure' || steps.project.outcome }}
          task: minimum Rust compilation
          name: minimum

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read

  gate:
    name: gate
    needs: [inputs, source, rust, boundary, platforms, msrv, merge-stops]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every actual source/native/security result
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"inputs":"success","source":"success","rust":"success","boundary":"success","platforms":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","msrv":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
