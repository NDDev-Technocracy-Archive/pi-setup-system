name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          ecosystems: cargo
      - name: Format, Clippy, build and test
        run: |
          cargo fmt --all --check
          python tools/with_libclang.py cargo clippy --locked --all-targets -- -D warnings
          python tools/with_libclang.py cargo build --locked --all-targets
          python tools/with_libclang.py python tools/build_crates_io.py --self-check
          python tools/with_libclang.py cargo test --locked --all-targets

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: rust
      - name: cargo-deny, cargo-audit and unused dependencies
        run: |
          cargo deny --all-features check bans licenses advisories sources
          cargo audit
          cargo-machete

  boundary:
    name: boundary (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent and that is a statement rather than an omission.
        # The equivalent question there is whether the import table names
        # `WS2_32.dll` and `CreateProcessW`, and reading a PE import table needs
        # `dumpbin` from a Visual Studio environment that is not on `PATH` by
        # default. A step that sometimes finds its tool is worse than a gap
        # nobody was told about, so the gap is written down here instead.
        # macOS joins on main; pull requests keep the Linux path.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No build cache here: this job reads the import table of bytes built by this commit.
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"

      - run: python tools/with_libclang.py cargo build --locked --release

      - name: The artifact does not link the network
        run: |
          set -euo pipefail
          bin=target/release/pi-setup-system
          case "$RUNNER_OS" in
            Linux) undefined() { nm -D --undefined-only "$1" | awk '{print $NF}' | sed 's/@.*//' | sort -u; } ;;
            macOS) undefined() { nm -u "$1" | sed 's/^_//' | sort -u; } ;;
            *) echo "no reader for $RUNNER_OS" >&2; exit 1 ;;
          esac

          # Whole names, never substrings. `sendfile64` is a file copy sitting
          # beside `copy_file_range` in any libc, and a substring match calls it
          # networking -- which is exactly how an earlier version of this
          # measurement reported a socket in a program that has never opened
          # one.
          # Before believing an empty answer, prove the instrument works. A
          # missing binary, or an `nm` that reports "no symbols", yields an
          # empty list -- which every test below reads as "imports nothing
          # bad" and passes. A check that goes green when its own tool is
          # broken is worse than no check, and this one did exactly that in
          # draft: `nm -u` against an ELF file (it needs `-D`) printed nothing
          # and the step passed a program that opens sockets for a living.
          test -f "$bin" || { echo "no binary at $bin" >&2; exit 1; }
          count=$(undefined "$bin" | grep -c . || true)
          if [ "$count" -lt 10 ]; then
            echo "read only $count undefined symbols from $bin; the reader is not working" >&2
            exit 1
          fi
          echo "read $count undefined symbols"

          net=$(undefined "$bin" | grep -xE 'socket|socketpair|connect|bind|listen|accept|accept4|sendto|sendmsg|recvfrom|recvmsg|getaddrinfo|gethostbyname|gethostbyname2|res_query|res_search' || true)
          echo "network imports: ${net:-(none)}"

          # Enforced on both. Reported without failing on macOS for one
          # release, because what this proves is that *our* code never reaches
          # for a socket while what it reads is whatever the linker left after
          # resolving that platform's std -- not the same claim, and no local
          # measurement could say whether they coincide there.
          #
          # `0.0.8`'s run said it: none, on all seven, on macOS as on Linux.
          if [ -n "$net" ]; then
            echo "this build imports network symbols:" >&2
            echo "$net" >&2
            exit 1
          fi
          echo "no network symbol is imported"

      - name: The import table agrees with the declaration
        run: |
          set -euo pipefail
          bin=target/release/pi-setup-system
          case "$RUNNER_OS" in
            Linux) undefined() { nm -D --undefined-only "$1" | awk '{print $NF}' | sed 's/@.*//' | sort -u; } ;;
            macOS) undefined() { nm -u "$1" | sed 's/^_//' | sort -u; } ;;
          esac
          test -f "$bin" || { echo "no binary at $bin" >&2; exit 1; }
          count=$(undefined "$bin" | grep -c . || true)
          if [ "$count" -lt 10 ]; then
            echo "read only $count undefined symbols from $bin; the reader is not working" >&2
            exit 1
          fi

          spawn=$(undefined "$bin" | grep -xE 'execve|execv|execvp|execvpe|fork|vfork|posix_spawn|posix_spawnp' || true)
          declared=$("$bin" provider-info | python3 -c 'import json,sys; print("yes" if "launch" in json.load(sys.stdin)["supported_commands"] else "no")')
          echo "launch declared: $declared"
          echo "spawn imports: ${spawn:-(none)}"

          # `clippy.toml` refuses `std::process::Command` outside the two places
          # allowed to hold it. This asks the shipped bytes the same question,
          # which is the stronger form of it: it survives the lint being wrong,
          # bypassed, or read by someone with no reason to trust it.
          #
          # Measured on Linux across all seven binaries, then on macOS by
          # `0.0.8`'s own run, and the two agree exactly: every build that
          # declares `launch` imports `execvp` and nothing else. `0.0.8` still
          # carried the era when antigravity declared none and imported no
          # spawn symbol at all -- all seven declare it now (antigravity's is
          # a documented-home binding), so today the negative arm is enforced
          # on nobody, and stays because the day a launch slips out of a
          # declaration is the day the spawn symbol must fail here.
          # So the linker drops what nothing calls and the absence is real
          # rather than incidental -- which is what had to be true before this
          # could be enforced anywhere.
          #
          # It shipped reporting-only on macOS for exactly one release. That
          # was not caution for its own sake: asserting a property of a system
          # nobody has measured is the habit this repository keeps taking out
          # of its own documents, and the first draft of this job enforced the
          # network step on macOS while writing that sentence one step below.
          if [ "$declared" = "no" ] && [ -n "$spawn" ]; then
            echo "no launch is declared and yet this build can spawn" >&2
            exit 1
          fi
          if [ "$declared" = "yes" ] && [ -z "$spawn" ]; then
            echo "launch is declared and this build imports nothing that could" >&2
            exit 1
          fi
          echo "the import table agrees with the declaration"

  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"
      - name: Tests on the other supported platforms
        run: python tools/with_libclang.py cargo test --locked --all-targets

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.89 --profile minimal
          echo RUSTUP_TOOLCHAIN=1.89 >> "$GITHUB_ENV"
      - name: Minimum supported Rust version
        run: python tools/with_libclang.py cargo check --locked --all-targets

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

  gate:
    needs: [rust, supply-chain, boundary, platforms, msrv, workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/gate@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"rust":"success","supply-chain":"success","boundary":"success","platforms":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","msrv":"${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}","workflows":"success"}
